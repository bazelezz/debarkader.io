    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7471"/>
      <stop offset="0.48" stop-color="#344f50"/>
      <stop offset="1" stop-color="#202f31"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.85" y2="1">
